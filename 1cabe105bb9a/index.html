<script>
"use strict";
const ITER=600000;
const cat=(...as)=>{let n=0;for(const a of as)n+=a.length;const o=new Uint8Array(n);let i=0;for(const a of as){o.set(a,i);i+=a.length}return o};
const toHex=b=>Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("");
async function decryptWith(pw){
  const raw=Uint8Array.from(atob(document.getElementById("payload").textContent.trim()),c=>c.charCodeAt(0));
  if(raw.length<64) throw new Error("payload 截断");
  const salt=raw.slice(0,16),iv=raw.slice(16,32),ct=raw.slice(32,raw.length-32),mac=raw.slice(raw.length-32);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const encRaw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:ITER},base,256));
  const mkRaw=await crypto.subtle.digest("SHA-256",cat(encRaw,Uint8Array.of(1)));
  const mk=await crypto.subtle.importKey("raw",mkRaw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const calc=new Uint8Array(await crypto.subtle.sign("HMAC",mk,cat(salt,iv,ct)));
  if(toHex(calc)!==toHex(mac)) throw new Error("bad-passphrase");
  const key=await crypto.subtle.importKey("raw",encRaw,"AES-CBC",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-CBC",iv},key,ct);
  // 严格 UTF-8：非法字节直接报错，绝不静默替换成 U+FFFD
  const dec=new TextDecoder("utf-8",{fatal:true});
  try { return dec.decode(plain); } catch(e) { throw new Error("bad-encoding"); }
}
document.getElementById("f").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const err=document.getElementById("e");
  try{
    const html=await decryptWith(document.getElementById("pw").value);
    document.open();document.write(html);document.close();
  }catch(ex){
    err.textContent = ex && ex.message === "bad-encoding" ? "内容编码异常（非 UTF-8），请联系发布者" : "密码不对，再试一次";
  }
});
</script>
